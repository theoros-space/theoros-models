name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_SYNC: "1"
  PYTHONHASHSEED: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - run: uv sync --extra cpu
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python scripts/check_repo.py

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - run: uv sync --extra cpu
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - run: uv sync --extra cpu
      - run: uv run pytest --cov --cov-report=json --cov-report=term
      - run: uv run python scripts/check_coverage.py coverage.json

  build:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - run: uv build
      - name: Install the wheel and run the CLI against the packaged catalogue
        run: |
          uv venv /tmp/wheel-check --python 3.11
          uv pip install --python /tmp/wheel-check --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<2.15"
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/theoros sensors list
          /tmp/wheel-check/bin/theoros budget
