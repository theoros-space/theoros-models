schema_version: 1
name: sentinel2_msi
platform: Sentinel-2A
instrument: MSI
description: >-
  All 13 MSI bands of Sentinel-2A. Bandwidths are the published values and
  are used as FWHM. L1C products from processing baseline 04.00 onward store
  reflectance as (DN - 1000) / 10000.
reference: >-
  ESA, Sentinel-2 MSI spectral bands (central wavelength and bandwidth,
  Sentinel-2A), SentiWiki; ESA, Sentinel-2 Products Specification Document,
  processing baseline 04.00 radiometric offset.
encoding:
  scale: 1.0e-4
  offset: -0.1
bands:
  - {name: B01, centre_nm: 442.7, fwhm_nm: 21.0, gsd_m: 60.0}
  - {name: B02, centre_nm: 492.4, fwhm_nm: 66.0, gsd_m: 10.0}
  - {name: B03, centre_nm: 559.8, fwhm_nm: 36.0, gsd_m: 10.0}
  - {name: B04, centre_nm: 664.6, fwhm_nm: 31.0, gsd_m: 10.0}
  - {name: B05, centre_nm: 704.1, fwhm_nm: 15.0, gsd_m: 20.0}
